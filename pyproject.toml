[project]
name = "alphapulse"
version = "0.1.0"
description = "AlphaPulse: Portfolio Risk & Volatility Monitor (Infotact Solutions Project 2)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "dash>=2.18.0",
    "dash-bootstrap-components>=1.6.0",
    "datasets>=3.0.0",
    "gunicorn>=23.0.0",
    "httpx>=0.27.0",
    "huggingface-hub>=0.26.0",
    "numpy>=2.1.0",
    "pandas>=2.2.0",
    "plotly>=5.24.0",
    "polars>=1.12.0",
    "pyarrow>=18.0.0",
    "pydantic-settings>=2.6.0",
    "pymongo>=4.10.0",
    "scipy>=1.14.0",
    "twelvedata>=1.2.28",
    "yfinance>=0.2.50",
]

[dependency-groups]
dev = [
    "ipykernel>=6.29.5",
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]
